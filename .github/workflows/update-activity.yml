name: Update Recent GitHub Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for relevant public activity
        id: activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          events="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/haile12michael12/events/public)"

          echo "$events" | jq -e 'type == "array"' > /dev/null
          activity_count="$(echo "$events" | jq '[.[] | select(.type == "IssueCommentEvent" or .type == "IssuesEvent" or .type == "PullRequestEvent" or .type == "ReleaseEvent")] | length')"
          if [ "$activity_count" -gt 0 ]; then
            echo "has_activity=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_activity=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update GitHub activity
        uses: jamesgeorge007/github-activity-readme@master
        if: steps.activity.outputs.has_activity == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_NAME: github-actions[bot]
          COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com